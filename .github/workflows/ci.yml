name: Engine

# The reducer is pure and dependency-free, so this is the whole gate: the type
# check that stands in for SPEC §3's TypeScript (see DECISIONS D1), and the
# reducer suite that SPEC §13 makes phase 1's definition of done.
#
# No browser, no server, no build.

on:
  push:
    branches: ['**']
    paths:
      - 'www/**'
      - 'scripts/**'
      - 'package.json'
      - 'tsconfig.json'
      - '.github/workflows/ci.yml'
  pull_request:
  workflow_dispatch:

concurrency:
  group: engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Typecheck (strict, noUncheckedIndexedAccess)
        run: npx tsc --noEmit
      - name: Reducer suite
        run: node scripts/test-engine.js
