<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0F1210">
  <meta name="color-scheme" content="dark">
  <title>NODE</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header id="topbar" class="topbar"></header>
  <main id="screen" class="screen" aria-live="polite"></main>
  <nav id="tabbar" class="tabbar" role="tablist"></nav>
  <div id="overlay" class="overlay" hidden></div>

  <script type="module" src="js/app.js"></script>
  <script>
    /* The service worker is what makes SPEC §2.5 / §12 true — the game must
       launch and play with the network off. It only registers over https, so
       the dev server at :8124 is unaffected. */
    if ('serviceWorker' in navigator && location.protocol === 'https:') {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
